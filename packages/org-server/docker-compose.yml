name: staka-org-server-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: staka
      POSTGRES_DB: staka
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1::5432"
    volumes:
      - staka_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staka -d staka"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: oven/bun:1.3.14
    working_dir: /app/packages/org-server
    volumes:
      - ../..:/app
    environment:
      DATABASE_URL: postgres://staka@postgres:5432/staka
    command:
      [
        "sh",
        "-c",
        "if [ -f db/migrations/meta/_journal.json ]; then bun src/db/migrate.ts; else exit 0; fi",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  org-server:
    build:
      context: ../..
      dockerfile: packages/org-server/Dockerfile
    ports:
      - "127.0.0.1::8080"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgres://staka@postgres:5432/staka
      DATABASE_APP_URL: postgres://staka_app@postgres:5432/staka
      DATABASE_ADMIN_URL: postgres://staka_admin@postgres:5432/staka
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  staka_pg_data:
