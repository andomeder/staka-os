name: staka-org-server-prod

# Deploy sketch only. Not runnable until the image supports migrate + *_FILE secrets.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: staka
    volumes:
      - staka_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d staka"]
      interval: 5s
      timeout: 5s
      retries: 20
    secrets:
      - postgres_user
      - postgres_password
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  org-server:
    image: ghcr.io/andomeder/staka-org-server:latest
    ports:
      - "127.0.0.1::8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      STAKA_JWT_KEYS_FILE: /run/secrets/staka_jwt_keys
    secrets:
      - database_url
      - staka_jwt_keys
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: ["not-ready"]

volumes:
  staka_pg_data:

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  staka_jwt_keys:
    file: ./secrets/staka_jwt_keys
