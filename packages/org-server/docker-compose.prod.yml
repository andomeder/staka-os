name: staka-org-server-prod

# Local/host layout: put this file under /opt/staka-org-server/ with secrets/ (dir 0700).
# Host port is STAKA_ORG_HOST_PORT (default 18080) so multi-project hosts and the VPS
# do not fight over localhost:8080. Container listen port stays 8080.
#   export STAKA_ORG_HOST_PORT=18080   # or any free high port
#   curl -fsS http://127.0.0.1:${STAKA_ORG_HOST_PORT:-18080}/v1/health
#   curl -fsS http://127.0.0.1:${STAKA_ORG_HOST_PORT:-18080}/v1/ready
#
# First bring-up: generate secrets (see scripts/gen-prod-secrets.sh), then:
#   docker compose -f docker-compose.prod.yml up -d --build
# Role passwords are applied once after migrate (see role-passwords).

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: staka
    volumes:
      - staka_pg_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d staka",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    secrets:
      - postgres_user
      - postgres_password
    # Needs write + chown on the data volume; do not harden with read_only/cap_drop.
    restart: unless-stopped

  migrate:
    image: ghcr.io/andomeder/staka-org-server:latest
    build:
      context: ../..
      dockerfile: packages/org-server/Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # Migrations create LOGIN roles without passwords. Set them from secrets once
  # after migrate so app/admin URLs can authenticate (scram).
  role-passwords:
    image: postgres:18-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        USER="$$(cat /run/secrets/postgres_user)"
        APP_PW="$$(cat /run/secrets/staka_app_password)"
        ADMIN_PW="$$(cat /run/secrets/staka_admin_password)"
        APP_SQL="$$(printf '%s' "$$APP_PW" | sed "s/'/''/g")"
        ADMIN_SQL="$$(printf '%s' "$$ADMIN_PW" | sed "s/'/''/g")"
        psql -h postgres -U "$$USER" -d staka -v ON_ERROR_STOP=1 \
          -c "ALTER ROLE staka_app WITH PASSWORD '$$APP_SQL';" \
          -c "ALTER ROLE staka_admin WITH PASSWORD '$$ADMIN_SQL';"
    secrets:
      - postgres_user
      - postgres_password
      - staka_app_password
      - staka_admin_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  org-server:
    image: ghcr.io/andomeder/staka-org-server:latest
    build:
      context: ../..
      dockerfile: packages/org-server/Dockerfile
    command: ["serve"]
    ports:
      # Host side only; change via STAKA_ORG_HOST_PORT. Never publish on 0.0.0.0.
      - "127.0.0.1:${STAKA_ORG_HOST_PORT:-18080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NODE_ENV: production
      TRUST_PROXY: "1"
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_APP_URL_FILE: /run/secrets/database_app_url
      DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      STAKA_JWT_KEYS_FILE: /run/secrets/staka_jwt_keys
    secrets:
      - database_url
      - database_app_url
      - database_admin_url
      - staka_jwt_keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      role-passwords:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # Distroless: no in-container curl. Probe from the host:
    #   curl -fsS http://127.0.0.1:${STAKA_ORG_HOST_PORT:-18080}/v1/health

volumes:
  staka_pg_data:

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  database_app_url:
    file: ./secrets/database_app_url
  database_admin_url:
    file: ./secrets/database_admin_url
  staka_jwt_keys:
    file: ./secrets/staka_jwt_keys
  staka_app_password:
    file: ./secrets/staka_app_password
  staka_admin_password:
    file: ./secrets/staka_admin_password
