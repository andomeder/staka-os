name: staka-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: staka_test
      POSTGRES_DB: staka_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staka_test -d staka_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql
