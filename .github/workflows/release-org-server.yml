name: release-org-server

on:
  push:
    tags:
      - "org-server-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-org-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          SHA="$(git rev-parse --short HEAD)"
          FULL="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/staka-org-server" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          SHA="${{ steps.meta.outputs.full }}"
          SHORT="${{ steps.meta.outputs.sha }}"
          docker build -f packages/org-server/Dockerfile \
            -t "${IMAGE}:${SHA}" \
            -t "${IMAGE}:${SHORT}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:${SHORT}"
          docker push "${IMAGE}:latest"
