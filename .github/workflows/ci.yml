name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: staka_test
          POSTGRES_DB: staka_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U staka_test -d staka_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Configure DATABASE_URL
        run: |
          PORT="${{ job.services.postgres.ports[5432] }}"
          echo "DATABASE_URL=postgres://staka_test@127.0.0.1:${PORT}/staka_test" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: bun test packages/protocol packages/org-server

      - name: drizzle-kit check
        working-directory: packages/org-server
        run: bun run db:check

      - name: Docker build check
        run: docker build --check -f packages/org-server/Dockerfile .

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build org-server image
        run: docker build -f packages/org-server/Dockerfile -t staka-org-server:ci .
