name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: staka_test
          POSTGRES_DB: staka_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U staka_test -d staka_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Socket.dev supply-chain scan
        run: |
          if [ -n "${SOCKET_API_KEY:-}" ]; then
            echo "Socket.dev scanner active (ran during bun install)."
          else
            echo "::notice::Socket.dev scan skipped - SOCKET_API_KEY not set. Set the repo secret to enable supply-chain scanning."
          fi

      - name: Configure DATABASE_URL
        run: |
          PORT="${{ job.services.postgres.ports[5432] }}"
          echo "DATABASE_URL=postgres://staka_test@127.0.0.1:${PORT}/staka_test" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: bun run test

      - name: Shell syntax check (installer scripts)
        run: bash scripts/check-shell-syntax.sh

      - name: drizzle-kit check
        working-directory: packages/org-server
        run: bun run db:check

      - name: Docker build
        run: docker build -f packages/org-server/Dockerfile -t staka-org-server:ci .

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            crates/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        working-directory: crates
        run: cargo build --locked

      - name: Test
        working-directory: crates
        run: cargo test --locked
